[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ant-colony"
version = "0.1.0"
description = "Enterprise multi-agent collaboration system"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src/*"]
